[build]
  command = "pnpm install --frozen-lockfile --prod=false && ./netlify/scripts/pre-build.sh && pnpm exec svelte-kit sync && pnpm run build && ./netlify/scripts/deploy-db.sh"
  publish = ".svelte-kit/netlify"
  functions = "netlify/functions"

[build.environment]
  # pnpm 11 requires Node >= 22.13 (uses the node:sqlite built-in)
  NODE_VERSION = "22"
  # Install devDependencies even when NODE_ENV=production (needed for the build).
  PNPM_FLAGS = "--prod=false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@node-rs/argon2",
    "oslo",
    "@oslojs/crypto",
    "@oslojs/encoding",
    "react",
    "react-dom",
    "react/jsx-runtime"
  ]

# Scheduled functions. Declared here (not in the Netlify UI) so a new site gets
# them on first deploy. Both call API routes that check CRON_SECRET_TOKEN.
[functions."recurring-charge-cron"]
  schedule = "0 2 * * *"  # 02:00 UTC daily: recurring subscription charges

[functions."booking-reminders-cron"]
  schedule = "0 6 * * *"  # 06:00 UTC = 08:00 SAST: next-day booking reminders

[context.production]
  environment = { NODE_ENV = "production" }
  
# Migrations are hand-written and committed; no context generates them during a build.
[context.development]
  environment = { NODE_ENV = "development" }

[context.branch-deploy]
  environment = { NODE_ENV = "development" }

# Retired pages (RETIRED_PATHS in src/lib/config/site-routes.ts). In split mode a
# path with no SvelteKit route never reaches hooks.server.ts, so Netlify sends
# these to the home page itself. site-routes.test.ts keeps the two lists in step.
[[redirects]]
  from = "/magazine"
  to = "/"
  status = 301

[[redirects]]
  from = "/magazine/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/cleaning-services-bryanston"
  to = "/"
  status = 301

[[redirects]]
  from = "/cleaning-services-cosmo-city"
  to = "/"
  status = 301

[[redirects]]
  from = "/cleaning-services-fourways"
  to = "/"
  status = 301

[[redirects]]
  from = "/cleaning-services-midrand"
  to = "/"
  status = 301

[[redirects]]
