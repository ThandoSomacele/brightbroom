# pnpm settings (pnpm v11+). This is the home for settings that previously
# lived under the "pnpm" field of package.json or in .npmrc.

# Hoisted (flat) node_modules layout instead of pnpm's default symlinked store.
# Required so that:
#   - Netlify's esbuild function bundler can resolve `external_node_modules`
#     (it does not follow pnpm's nested symlink store reliably), and
#   - the node_modules symlinked across our git worktrees keeps working.
nodeLinker: hoisted

# Install missing non-optional peer dependencies automatically
# (replaces npm's legacy-peer-deps behaviour).
autoInstallPeers: true

# allowBuilds explicitly approves dependency build (postinstall) scripts
# (a bare name matches all versions):
#   esbuild - places the platform binary used by Vite.
#   sharp   - native image-processing bindings used for S3 image resizing.
#   core-js - postinstall is only a funding message, so keep it disallowed.
allowBuilds:
  esbuild: true
  sharp: true
  core-js: false

minimumReleaseAgeExclude:
  - '@img/sharp-darwin-arm64@0.35.4'
  - '@img/sharp-darwin-x64@0.35.4'
  - '@img/sharp-freebsd-wasm32@0.35.4'
  - '@img/sharp-libvips-darwin-arm64@1.3.3'
  - '@img/sharp-libvips-darwin-x64@1.3.3'
  - '@img/sharp-libvips-linux-arm64@1.3.3'
  - '@img/sharp-libvips-linux-arm@1.3.3'
  - '@img/sharp-libvips-linux-ppc64@1.3.3'
  - '@img/sharp-libvips-linux-riscv64@1.3.3'
  - '@img/sharp-libvips-linux-s390x@1.3.3'
  - '@img/sharp-libvips-linux-x64@1.3.3'
  - '@img/sharp-libvips-linuxmusl-arm64@1.3.3'
  - '@img/sharp-libvips-linuxmusl-x64@1.3.3'
  - '@img/sharp-linux-arm64@0.35.4'
  - '@img/sharp-linux-arm@0.35.4'
  - '@img/sharp-linux-ppc64@0.35.4'
  - '@img/sharp-linux-riscv64@0.35.4'
  - '@img/sharp-linux-s390x@0.35.4'
  - '@img/sharp-linux-x64@0.35.4'
  - '@img/sharp-linuxmusl-arm64@0.35.4'
  - '@img/sharp-linuxmusl-x64@0.35.4'
  - '@img/sharp-wasm32@0.35.4'
